AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Stripe payments backend for Karavan Imports (cards + ACH) — API Gateway +
  Lambda for payment-method setup, on-demand Pay Now, and webhook
  reconciliation, plus a scheduled Lambda that scans ERPNext for due
  auto-pay invoices. Deployed separately from erpnext.yaml since this is
  event-driven/serverless rather than the always-on Docker Compose stack.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment. Controls log retention and alarm wiring.

  ERPNextURL:
    Type: String
    Default: https://erpnext.karavanimports.com
    Description: Base URL of the ERPNext site the Lambdas call.

  CodeS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged payments/ Lambda deployment zip.

  CodeS3Key:
    Type: String
    Description: S3 key of the packaged payments/ Lambda deployment zip (built from payments/ + payments/requirements.txt).

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for CloudWatch alarm notifications on Lambda errors. Leave blank to disable.

  # NOTE: Stripe / ERPNext / Base44 credentials are NOT template parameters —
  # they used to be (back when this was the Dwolla/Plaid version), which left
  # them retrievable via describe-stacks and change-set history. They live
  # only in the PaymentsSecret value, populated out-of-band after deploy (see
  # .github/workflows/deploy-payments.yml and payments/README.md). The JSON
  # shape the Lambdas expect is documented on the PaymentsSecret resource below.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment
        Parameters:
          - Environment
          - ERPNextURL
      - Label:
          default: Lambda Code
        Parameters:
          - CodeS3Bucket
          - CodeS3Key
      - Label:
          default: Monitoring
        Parameters:
          - NotificationEmail

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]

Resources:
  PaymentsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: >
        Credentials for the Stripe payments Lambdas. The VALUE is populated
        out-of-band after stack deploy (deploy-payments.yml / payments/README.md)
        — never via a CloudFormation parameter. CloudFormation manages only the
        secret container, so a redeploy does not overwrite the value.
        Expected JSON keys:
          stripe_secret_key, stripe_publishable_key, stripe_webhook_secret,
          erpnext_api_key, erpnext_api_secret, base44_shared_secret

  PaymentsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PaymentsSecretAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref PaymentsSecret

  SetupIntentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-setup-intent
      Runtime: python3.12
      Handler: setup_intent.handler.handler
      Role: !GetAtt PaymentsLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PAYMENTS_SECRET_ARN: !Ref PaymentsSecret
          ERPNEXT_URL: !Ref ERPNextURL

  AttachPaymentMethodFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-attach-payment-method
      Runtime: python3.12
      Handler: attach_payment_method.handler.handler
      Role: !GetAtt PaymentsLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PAYMENTS_SECRET_ARN: !Ref PaymentsSecret
          ERPNEXT_URL: !Ref ERPNextURL

  PayNowFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-pay-now
      Runtime: python3.12
      Handler: pay_now.handler.handler
      Role: !GetAtt PaymentsLambdaRole.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PAYMENTS_SECRET_ARN: !Ref PaymentsSecret
          ERPNEXT_URL: !Ref ERPNextURL

  StripeWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-stripe-webhook
      Runtime: python3.12
      Handler: stripe_webhook.handler.handler
      Role: !GetAtt PaymentsLambdaRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PAYMENTS_SECRET_ARN: !Ref PaymentsSecret
          ERPNEXT_URL: !Ref ERPNextURL

  AutopayScanFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-autopay-scan
      Runtime: python3.12
      Handler: autopay_scan.handler.handler
      Role: !GetAtt PaymentsLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Environment:
        Variables:
          PAYMENTS_SECRET_ARN: !Ref PaymentsSecret
          ERPNEXT_URL: !Ref ERPNextURL

  AutopayScanSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-autopay-scan-schedule
      Description: Triggers autopay-scan hourly to initiate off-session Stripe charges for due, auto-pay-enabled invoices.
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Id: AutopayScanFunction
          Arn: !GetAtt AutopayScanFunction.Arn

  AutopayScanSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutopayScanFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AutopayScanSchedule.Arn

  PaymentsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      ProtocolType: HTTP

  SetupIntentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SetupIntentFunction.Arn
      PayloadFormatVersion: '2.0'

  SetupIntentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentsApi
      RouteKey: POST /setup-intent
      Target: !Sub integrations/${SetupIntentIntegration}

  SetupIntentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SetupIntentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentsApi}/*/*/setup-intent

  AttachPaymentMethodIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AttachPaymentMethodFunction.Arn
      PayloadFormatVersion: '2.0'

  AttachPaymentMethodRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentsApi
      RouteKey: POST /attach-payment-method
      Target: !Sub integrations/${AttachPaymentMethodIntegration}

  AttachPaymentMethodPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AttachPaymentMethodFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentsApi}/*/*/attach-payment-method

  PayNowIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PayNowFunction.Arn
      PayloadFormatVersion: '2.0'

  PayNowRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentsApi
      RouteKey: POST /pay-now
      Target: !Sub integrations/${PayNowIntegration}

  PayNowPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PayNowFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentsApi}/*/*/pay-now

  StripeWebhookIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PaymentsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StripeWebhookFunction.Arn
      PayloadFormatVersion: '2.0'

  StripeWebhookRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PaymentsApi
      RouteKey: POST /webhooks/stripe
      Target: !Sub integrations/${StripeWebhookIntegration}

  StripeWebhookPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StripeWebhookFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PaymentsApi}/*/*/webhooks/stripe

  PaymentsApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PaymentsApi
      StageName: !Ref Environment
      AutoDeploy: true

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub ${AWS::StackName}-alarms
      Subscription: !If
        - HasNotificationEmail
        - - Protocol: email
            Endpoint: !Ref NotificationEmail
        - !Ref AWS::NoValue

  StripeWebhookErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-stripe-webhook-errors
      AlarmDescription: stripe-webhook Lambda is erroring — a payment completion/failure event may not have reconciled into ERPNext. Needs human follow-up.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref StripeWebhookFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching

  AutopayScanErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-autopay-scan-errors
      AlarmDescription: autopay-scan Lambda is erroring — due invoices may not be getting their Stripe charges initiated.
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AutopayScanFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching

Outputs:
  ApiBaseUrl:
    Description: Base URL Base44 should call for /setup-intent, /attach-payment-method, and /pay-now.
    Value: !Sub https://${PaymentsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  StripeWebhookUrl:
    Description: Register this URL as the Stripe webhook endpoint (Developers -> Webhooks).
    Value: !Sub https://${PaymentsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhooks/stripe

  PaymentsSecretArn:
    Description: Secrets Manager ARN holding Stripe/ERPNext credentials.
    Value: !Ref PaymentsSecret
